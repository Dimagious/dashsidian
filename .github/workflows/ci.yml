name: ci
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, typecheck, unit tests with the coverage gate, the scanner, the release check, the build with its
  # Node-only check, and the bundle artifact (dashsidian-bundle).
  kit:
    uses: Dimagious/obsidian-plugin-dev-kit/.github/workflows/plugin-ci.yml@9de7d2f0bd83d4aeb0b6f7f3566915eb3823cfdf # v0.3.1

  # Only Dashy checks these. They read the repository's files and need no install.
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Agent skill is in sync with block schemas
        run: npm run build:skill -- --check

      - name: Site block reference is in sync with block schemas
        run: npm run build:reference -- --check

      - name: Project site (broken images, dead anchors, dashes, required files)
        run: npm run site:check

      - name: README (broken images, dead anchors, dashes)
        run: npm run readme:check
