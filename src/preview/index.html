<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashy — preview stand</title>
<link rel="stylesheet" href="./styles.css">
<style>
/* A rough stand-in for what Obsidian and its themes declare.
   On body, never on :root — that is the whole point of ADR 0002, and a stand
   that declared them higher up would quietly pass where Obsidian fails. */
body[data-theme="dark"] {
  --background-primary: #1e1e1e;
  --background-secondary: #252525;
  --background-modifier-border: #3a3a3a;
  --background-modifier-hover: #2d2d2d;
  --text-normal: #dcddde;
  --text-muted: #999;
  --text-faint: #666;
  --text-error: #ff6b6b;
  --text-on-accent: #fff;
  --interactive-accent: #8b6cef;
  --color-red: #e93147;
  --color-green: #44cf6e;
  --shadow-s: 0 2px 4px rgba(0,0,0,.3);
  --shadow-l: 0 6px 16px rgba(0,0,0,.4);
}
body[data-theme="light"] {
  --background-primary: #fff;
  --background-secondary: #f5f6f8;
  --background-modifier-border: #e0e0e0;
  --background-modifier-hover: #ededed;
  --text-normal: #222;
  --text-muted: #777;
  --text-faint: #aaa;
  --text-error: #c0392b;
  --text-on-accent: #fff;
  --interactive-accent: #705dcf;
  --color-red: #e93147;
  --color-green: #2e9e4f;
  --shadow-s: 0 2px 4px rgba(0,0,0,.06);
  --shadow-l: 0 6px 16px rgba(0,0,0,.12);
}
body {
  margin: 0;
  padding: 24px 32px 64px;
  background: var(--background-primary);
  color: var(--text-normal);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
header { display: flex; gap: 16px; align-items: baseline; margin-bottom: 28px; }
h1 { font-size: 1.2em; margin: 0; }
header label { font-size: .8em; color: var(--text-muted); }
select { font: inherit; font-size: .85em; }
.case { margin-bottom: 40px; }
.case-title { font-weight: 600; margin-bottom: 8px; }
.case-source {
  margin: 0 0 12px; padding: 10px 12px;
  background: var(--background-secondary);
  border: 1px solid var(--background-modifier-border);
  border-radius: 8px;
  font-size: .72em; line-height: 1.45; white-space: pre-wrap;
  color: var(--text-muted); overflow-x: auto;
}
</style>
</head>
<body data-theme="dark">
<header>
  <h1>Dashy — preview stand</h1>
  <label>theme <select id="theme"><option value="dark">dark</option><option value="light">light</option></select></label>
  <label>language <select id="locale"></select></label>
</header>
<div id="cases"></div>
<script src="./stand.js"></script>
</body>
</html>
