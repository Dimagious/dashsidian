<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-labelledby="dashy-banner-title">
  <title id="dashy-banner-title">Dashy: a dashboard inside an Obsidian note, built from six markdown blocks</title>
  <rect x="0.5" y="0.5" width="899" height="159" rx="20" fill="#ffffff" stroke="#e3e3e3"/>
  <g transform="translate(32,32) scale(3)">
    <rect x="2" y="2" width="28" height="28" rx="7" fill="#7c5ce8"/>
    <rect x="7" y="7.5" width="11" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="7" y="13" width="8.5" height="7" rx="2" fill="#ffffff" fill-opacity=".55"/>
    <rect x="16.5" y="13" width="8.5" height="7" rx="2" fill="#ffffff"/>
    <rect x="7" y="22.5" width="18" height="3" rx="1.5" fill="#ffffff" fill-opacity=".35"/>
    <rect x="7" y="22.5" width="12" height="3" rx="1.5" fill="#ffffff"/>
  </g>
  <g transform="translate(152,78.5)">
    <text x="0" y="0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <tspan font-weight="700" font-size="36" fill="#222222">Dashy</tspan><tspan dx="12" font-size="15" fill="#8e8e8e" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace">dashsidian</tspan>
    </text>
    <text x="0" y="32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#5c5c5c">A dashboard inside an Obsidian note, built from six markdown blocks.</text>
  </g>
</svg>
