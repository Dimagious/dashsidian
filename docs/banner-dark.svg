    </text>
    <text x="0" y="32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#a8a8a8">A dashboard inside an Obsidian note, built from six markdown blocks.</text>
