<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-labelledby="dashy-banner-title-dark">
  <title id="dashy-banner-title-dark">Dashy: a dashboard inside an Obsidian note, built from six markdown blocks</title>
  <rect x="0.5" y="0.5" width="899" height="159" rx="20" fill="#1e1e1e" stroke="#363636"/>
  <g transform="translate(32,32) scale(3)">
    <rect x="2" y="2" width="28" height="28" rx="7" fill="#8b6cef"/>
    <rect x="7" y="7.5" width="11" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="7" y="13" width="8.5" height="7" rx="2" fill="#ffffff" fill-opacity=".55"/>
    <rect x="16.5" y="13" width="8.5" height="7" rx="2" fill="#ffffff"/>
    <rect x="7" y="22.5" width="18" height="3" rx="1.5" fill="#ffffff" fill-opacity=".35"/>
